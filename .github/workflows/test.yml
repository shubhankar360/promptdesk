name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # No ANTHROPIC_API_KEY or OPENAI_API_KEY is set on purpose: the agent
      # falls back to demo mode, and the suite must pass without credentials.
      - run: python -m pytest -q
